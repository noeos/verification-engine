name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  NPM_CONFIG_OMIT: "optional"

jobs:
  quality:
    name: Required · quality and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up primary Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: Verify primary Node and bundled npm
        run: npm run toolchain:check -- --profile node-24-primary
      - name: Install from reviewed lockfile
        run: npm ci --ignore-scripts --omit=optional
      - name: Repository and documentation policy
        run: npm run policy:check && npm run docs:check
      - name: Formatting and lint
        run: npm run format:check && npm run lint
      - name: Strict TypeScript and tests
        run: npm run typecheck && npm run test:coverage
      - name: Public API report
        run: npm run api:check
      - name: Licenses and package boundary
        run: npm run license:check && npm run pack:check
      - name: Critical-path waiting period
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOEOS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NOEOS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-critical-wait.mjs
      - name: DCO sign-off
        if: github.event_name == 'pull_request'
        env:
          NOEOS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NOEOS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-dco.mjs

  compatibility:
    name: Required · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22.14.0
            profile: node-22-minimum
          - os: ubuntu-24.04
            node: 22.23.2
            profile: node-22-latest
          - os: ubuntu-24.04
            node: 24.20.0
            profile: node-24-primary
          - os: windows-2025
            node: 24.20.0
            profile: node-24-primary
          - os: macos-15
            node: 24.20.0
            profile: node-24-primary
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
      - name: Verify Node and bundled npm
        run: npm run toolchain:check -- --profile ${{ matrix.profile }}
      - name: Install and verify consumers
        run: npm ci --ignore-scripts --omit=optional && npm run typecheck && npm test && npm run consumer:check

  node-current:
    name: Informational · Node 26 Current
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NPM_CONFIG_ENGINE_STRICT: "false"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node Current
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.0
      - name: Verify current Node and bundled npm
        run: npm run toolchain:check -- --profile node-26-current
      - name: Run compatibility smoke
        run: npm ci --ignore-scripts --omit=optional && npm test

  reproducibility:
    name: Required · package reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up primary Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify primary Node and bundled npm
        run: npm run toolchain:check -- --profile node-24-primary
      - name: Install from reviewed lockfile
        run: npm ci --ignore-scripts --omit=optional
      - name: Verify clean consumers and reproducibility
        run: npm run consumer:check && npm run reproducibility:check
