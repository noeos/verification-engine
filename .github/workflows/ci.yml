name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  NPM_CONFIG_OMIT: "optional"

jobs:
  quality:
    name: Required · quality and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up primary Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: Set up independent reference Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.15
      - name: Verify primary Node and bundled npm
        run: node scripts/check-toolchain.mjs --profile node-24-primary
      - name: Verify independent reference runtime
        run: node scripts/check-reference-toolchain.mjs
      - name: Install from reviewed lockfile
        run: node scripts/run-verified-package-manager.mjs --profile node-24-primary -- ci --ignore-scripts --omit=optional
      - name: Repository and documentation policy
        run: node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run policy:check && node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run governance:check && node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run docs:check && node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run contracts:check && node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run vectors:check
      - name: Formatting and lint
        run: node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run build && node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run format:check && node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run lint
      - name: Strict TypeScript and tests
        run: node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run build && node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run typecheck && node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run test:coverage
      - name: Fuzz smoke and critical mutation gates
        run: node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run security:boundaries && node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run fuzz:smoke && node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run mutation:check && node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run security:drill
      - name: Public API report
        run: node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run api:check
      - name: Licenses and package boundary
        run: node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run license:check && node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run pack:check
      - name: DCO sign-off
        if: github.event_name == 'pull_request'
        env:
          NOEOS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NOEOS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-dco.mjs

  compatibility:
    name: Required · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22.14.0
            profile: node-22-minimum
          - os: ubuntu-24.04
            node: 22.23.2
            profile: node-22-latest
          - os: ubuntu-24.04
            node: 24.20.0
            profile: node-24-primary
          - os: windows-2025
            node: 24.20.0
            profile: node-24-primary
          - os: macos-15
            node: 24.20.0
            profile: node-24-primary
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
      - name: Set up independent reference Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.15
      - name: Verify Node and bundled npm
        run: node scripts/check-toolchain.mjs --profile ${{ matrix.profile }}
      - name: Verify independent reference runtime
        run: node scripts/check-reference-toolchain.mjs
      - name: Install and verify consumers
        run: node scripts/run-verified-package-manager.mjs --profile ${{ matrix.profile }} -- ci --ignore-scripts --omit=optional && node scripts/run-verified-package-manager.mjs --profile ${{ matrix.profile }} -- run build && node scripts/run-verified-package-manager.mjs --profile ${{ matrix.profile }} -- run typecheck && node scripts/run-verified-package-manager.mjs --profile ${{ matrix.profile }} -- run test && node scripts/run-verified-package-manager.mjs --profile ${{ matrix.profile }} -- run consumer:check

  node-current:
    name: Informational · Node 26 Current
    needs: reproducibility
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NPM_CONFIG_ENGINE_STRICT: "false"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node Current
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          package-manager-cache: false
      - name: Verify current Node and bundled npm
        run: node scripts/check-toolchain.mjs --profile node-26-current
      - name: Download build produced on the primary runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: current-runtime-${{ github.sha }}
          path: artifacts/current-runtime
      - name: Extract reviewed runtime build
        run: tar --extract --gzip --file artifacts/current-runtime/current-runtime.tgz
      - name: Recreate package layout for runtime smoke
        run: |
          mkdir --parents node_modules/@noeos
          ln --symbolic --force "$GITHUB_WORKSPACE/packages/engine" node_modules/@noeos/verification-engine
          ln --symbolic --force "$GITHUB_WORKSPACE/packages/cli" node_modules/@noeos/verification-engine-cli
      - name: Run compatibility smoke without installing on an unsupported line
        run: node scripts/check-runtime-smoke.mjs

  reproducibility:
    name: Required · package reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up primary Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify primary Node and bundled npm
        run: node scripts/check-toolchain.mjs --profile node-24-primary
      - name: Install from reviewed lockfile
        run: node scripts/run-verified-package-manager.mjs --profile node-24-primary -- ci --ignore-scripts --omit=optional
      - name: Verify clean consumers and reproducibility
        run: node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run consumer:check && node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run reproducibility:check
      - name: Bundle the reviewed runtime build
        run: tar --create --gzip --file current-runtime.tgz packages/engine/dist packages/cli/dist
      - name: Upload reviewed build for the current-runtime signal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-runtime-${{ github.sha }}
          path: current-runtime.tgz
          if-no-files-found: error
          retention-days: 1
