name: Performance evidence

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "41 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Informational · performance smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up primary Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify primary Node and bundled npm
        run: node scripts/check-toolchain.mjs --profile node-24-primary
      - name: Install reviewed dependencies
        run: node scripts/run-verified-package-manager.mjs --profile node-24-primary -- ci --ignore-scripts --omit=optional
      - name: Run smoke benchmark
        run: node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run perf:smoke

  official:
    name: Governed · official performance budgets
    if: github.event_name != 'pull_request' && vars.PERFORMANCE_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, noeos-performance, linux, x64]
    timeout-minutes: 90
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up primary Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Verify primary Node and bundled npm
        run: node scripts/check-toolchain.mjs --profile node-24-primary
      - name: Install reviewed dependencies
        run: node scripts/run-verified-package-manager.mjs --profile node-24-primary -- ci --ignore-scripts --omit=optional
      - name: Execute absolute and relative budgets
        env:
          NODE_OPTIONS: --expose-gc
          NOEOS_BENCH_REPORT: benchmarks/reports/phase1011-${{ github.sha }}.json
        run: node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run perf:check
      - name: Collect CPU and heap profiles
        run: node scripts/run-verified-package-manager.mjs --profile node-24-primary -- run profile:phase1011
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ github.sha }}
          path: benchmarks/reports/
          if-no-files-found: error
          retention-days: 90
