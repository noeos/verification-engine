name: Release candidate evidence

on:
  push:
    tags:
      - "v*.*.*-rc.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noeos-release-candidate
  cancel-in-progress: false

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  NPM_CONFIG_OMIT: "optional"

jobs:
  evidence:
    name: Prepare and attest candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require candidate ancestry from protected main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
            candidate="$GITHUB_SHA"
          else
            candidate="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          fi
          git merge-base --is-ancestor "$candidate" "origin/main"
      - name: Trust reviewed release signing keys
        if: github.ref_type == 'tag'
        run: git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/security/allowed-signers"
      - name: Require signed release tag
        if: github.ref_type == 'tag'
        run: git verify-tag "$GITHUB_REF_NAME"
      - name: Set up primary Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: Pin npm and install from scratch
        run: npm install --global npm@11.17.0 --ignore-scripts && npm ci --ignore-scripts --omit=optional
      - name: Run all local gates
        run: npm run ci
      - name: Build candidate tarballs
        run: mkdir -p artifacts/release && npm pack --json --ignore-scripts --pack-destination artifacts/release --workspaces > artifacts/release/pack-manifest.json
      - name: Generate checksums
        working-directory: artifacts/release
        run: sha256sum *.tgz > SHA256SUMS && sha512sum *.tgz > SHA512SUMS
      - name: Attest candidate tarballs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/release/*.tgz
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            artifacts/release/
            artifacts/sbom/
          if-no-files-found: error
          retention-days: 90

  stage:
    name: Protected npm stage
    needs: evidence
    if: github.ref_type == 'tag' && vars.NPM_STAGE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download reviewed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-candidate-${{ github.sha }}
          path: artifacts
      - name: Set up trusted-publishing runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
      - name: Pin trusted-publishing npm version
        run: npm install --global npm@11.17.0 --ignore-scripts
      - name: Stage packages through OIDC
        shell: bash
        run: |
          set -euo pipefail
          for package in artifacts/release/*.tgz; do
            npm stage publish "$package" --provenance --access public --tag next
          done
